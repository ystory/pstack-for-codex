<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1192" viewBox="0 0 1200 1192" role="img" aria-labelledby="title description">
  <title id="title">How pstack for Codex approaches a task</title>
  <desc id="description">A task enters poteto-mode, which selects a playbook and uses situational skills for understanding, design, parallel work, and review. Evidence and checks support a cited answer, verified changes, or an appropriate PR. Setup stores 17 role choices. Defaults use Sol 6.1 through Codex native agents and Opus 5.5 through Claude Code for the hardest tasks and diverse panels. Parallel implementation uses local Git worktrees. Principles guide every stage.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #222326; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #c90020; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 20px; fill: #616269; }
      .number { font-size: 17px; font-weight: 700; fill: #c90020; }
      .stage { font-size: 23px; font-weight: 700; letter-spacing: -.3px; }
      .body { font-size: 20px; fill: #52545a; }
      .small { font-size: 20px; fill: #616269; }
      .skill { font-size: 21px; font-weight: 700; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 22px; font-weight: 600; fill: #b8001d; }
      .side-title { font-size: 21px; font-weight: 700; }
      .side-label { font-size: 18px; font-weight: 700; }
      .side-body { font-size: 20px; fill: #616269; }
      .line { fill: none; stroke: #c6c7cb; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#9a9ca3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1200" height="1192" rx="24" fill="#faf9f6" />
  <text x="48" y="48" class="eyebrow">PSTACK FOR CODEX</text>
  <text x="48" y="94" class="title">A task, the right tools, and evidence.</text>
  <text x="48" y="128" class="subtitle">A playbook selects the work. Skills supply the depth.</text>

  <!-- Task flow -->
  <rect x="48" y="162" width="704" height="94" rx="16" fill="#ffffff" stroke="#dedfe2" />
  <text x="70" y="196" class="number">01</text>
  <text x="110" y="196" class="stage">Frame the task</text>
  <text x="110" y="229" class="body">Goal, scope, and a clear done check.</text>
  <path d="M400 258v23" class="line" marker-end="url(#arrow)" />

  <rect x="48" y="288" width="704" height="132" rx="16" fill="#fff0f1" stroke="#edb8c0" />
  <text x="70" y="322" class="number">02</text>
  <text x="110" y="322" class="stage">Choose the playbook</text>
  <text x="110" y="356" class="code">$pstack-for-codex:poteto-mode</text>
  <text x="110" y="389" class="body">Investigation, bug fix, feature, refactoring, and more.</text>
  <path d="M400 422v23" class="line" marker-end="url(#arrow)" />

  <rect x="48" y="452" width="704" height="328" rx="16" fill="#ffffff" stroke="#dedfe2" />
  <text x="70" y="486" class="number">03</text>
  <text x="110" y="486" class="stage">Use the skills the task calls for</text>
  <text x="110" y="515" class="small">Select and combine as the playbook needs them.</text>
  <path d="M400 538v216M72 604h656M72 682h656" stroke="#e9e9eb" fill="none" />

  <text x="76" y="558" class="skill">how</text>
  <text x="76" y="585" class="small">Understand code and behavior</text>
  <text x="424" y="558" class="skill">why</text>
  <text x="424" y="585" class="small">Trace history and rationale</text>

  <text x="76" y="636" class="skill">architect</text>
  <text x="76" y="663" class="small">Compare designs, then sketch</text>
  <text x="424" y="636" class="skill">arena</text>
  <text x="424" y="663" class="small">Compare, judge, graft</text>

  <text x="76" y="714" class="skill">swarm</text>
  <text x="76" y="741" class="small">Parallel slices, one report</text>
  <text x="424" y="714" class="skill">interrogate</text>
  <text x="424" y="741" class="small">Challenge a change</text>
  <path d="M400 782v23" class="line" marker-end="url(#arrow)" />

  <rect x="48" y="812" width="704" height="116" rx="16" fill="#ffffff" stroke="#dedfe2" />
  <text x="70" y="846" class="number">04</text>
  <text x="110" y="846" class="stage">Prove and review</text>
  <text x="110" y="879" class="body">Use source evidence or checks on the actual artifact.</text>
  <text x="110" y="907" class="small">Tests · control-ui / control-cli · review where required.</text>
  <path d="M400 930v23" class="line" marker-end="url(#arrow)" />

  <rect x="48" y="960" width="704" height="96" rx="16" fill="#222326" />
  <text x="70" y="994" class="number" style="fill:#ff899b">05</text>
  <text x="110" y="994" class="stage" style="fill:#ffffff">Return the right outcome</text>
  <text x="110" y="1027" class="body" style="fill:#e3e3e5">Cited answer, verified changes, or a PR when appropriate.</text>

  <!-- Configuration and execution context -->
  <rect x="792" y="162" width="360" height="218" rx="16" fill="#f0eeea" />
  <text x="816" y="197" class="side-title">Setup shapes the team</text>
  <text x="816" y="231" class="side-label">setup-pstack</text>
  <text x="816" y="262" class="side-body">17 saved role choices</text>
  <text x="816" y="290" class="side-body">Model + reasoning effort</text>
  <text x="816" y="321" class="side-label" style="font-family:Consolas,monospace">models.json</text>
  <text x="816" y="352" class="side-body">Your choices override defaults.</text>

  <rect x="792" y="404" width="360" height="354" rx="16" fill="#f0eeea" />
  <text x="816" y="440" class="side-title">Default execution</text>
  <circle cx="823" cy="478" r="5" fill="#c90020" />
  <text x="840" y="484" class="side-label">Sol 6.1 · Codex native agents</text>
  <text x="840" y="516" class="side-body">Ordinary work, explanation,</text>
  <text x="840" y="544" class="side-body">judgment, and synthesis</text>
  <path d="M816 568h312" stroke="#d6d4d0" />
  <circle cx="823" cy="599" r="5" fill="#c90020" />
  <text x="840" y="605" class="side-label">Opus 5.5 · Claude Code CLI</text>
  <text x="840" y="637" class="side-body">The hardest tasks</text>
  <text x="816" y="683" class="side-label">Sol + Opus panels</text>
  <text x="816" y="714" class="side-body">Designs, candidates, reviewers,</text>
  <text x="816" y="742" class="side-body">and a cross-judge pool</text>

  <rect x="792" y="782" width="360" height="274" rx="16" fill="#f0eeea" />
  <text x="816" y="818" class="side-title">Parallel implementation</text>
  <path d="M823 850v36m0-18h48m0-18v36m-48-18h96m0-18v36" fill="none" stroke="#c90020" stroke-width="3" stroke-linecap="round" />
  <text x="816" y="923" class="side-body">Local Git worktrees keep</text>
  <text x="816" y="951" class="side-body">parallel changes separate.</text>
  <text x="816" y="1027" class="side-body">The parent collects the results.</text>

  <!-- Cross-cutting principles -->
  <path d="M48 1090h1104" stroke="#dedbd6" />
  <rect x="48" y="1111" width="4" height="48" rx="2" fill="#c90020" />
  <text x="68" y="1131" class="side-label">Principles guide every stage</text>
  <text x="68" y="1159" class="small">Model the domain · prove it works · subtract before adding · read the relevant principle leaf.</text>
</svg>
